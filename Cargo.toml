[package]
name = "wireant"
version = "0.12.2"
edition = "2024"
description = "Program for modelling antennas (MININEC, wiremom and NEC-2 engines)"
license = "GPL-3.0-or-later"
repository = "https://github.com/tanganyika/wireant"

[dependencies]
dirs = "6"
# wgpu (default) and glow, the fallback for graphics drivers wgpu can't use
eframe = { version = "0.37.0", features = ["glow"] }
# the same monochrome icon glyphs on every platform (egui 0.37 otherwise takes them from system fonts)
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
num-complex = "0.4.6"
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# downloads elevation tiles for the terrain (HTTPS, rustls)
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
wiremom = { git = "https://github.com/tanganyika/wiremom", branch = "master" }

[profile.dev]
opt-level = 2
debug = false

[profile.release]
opt-level = 3

[build-dependencies]
cc = "1"
winresource = "0.1"
