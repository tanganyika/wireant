[package]
name = "wireant-android"
version = "0.12.2"
edition = "2024"
description = "wireant for Android (proof of concept): the desktop sources with an Android entry point"
license = "GPL-3.0-or-later"

# standalone, not part of the desktop build
[workspace]

[lib]
name = "wireant"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
dirs = "6"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
# egui 0.37 takes emoji/icon glyphs (➕ 🗑 ▶ ...) from system fonts, which Android lacks; bundle them
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
num-complex = "0.4.6"
rayon = "1.12.0"
rfd = { path = "rfd-stub" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# downloads elevation tiles for the terrain (HTTPS, rustls)
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
wiremom = { git = "https://github.com/tanganyika/wiremom", branch = "master" }
log = "0.4"
android_logger = "0.15"
winit = { version = "0.30", features = ["android-native-activity"] }
jni = "0.21"

[package.metadata.android]
package = "radio.wireant"
# the launcher icon (res/mipmap-*), made from ../packaging/wireant-1024.png
resources = "res"
build_targets = ["x86_64-linux-android", "aarch64-linux-android"]

# Terrain ▸ From elevation data downloads map tiles
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "wireant"
icon = "@mipmap/ic_launcher"
# MainActivity.java (the file picker) is added to the APK by build-apk.sh
has_code = true
# no action bar: some phones (OnePlus, Android 13) otherwise reserve an empty 56 dp bar under the status bar
theme = "@android:style/Theme.DeviceDefault.Light.NoActionBar"

[package.metadata.android.application.activity]
name = "radio.wireant.MainActivity"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden"
orientation = "unspecified"

[profile.release]
opt-level = 3

# signing: build-apk.sh passes the key to cargo-apk (CARGO_APK_RELEASE_KEYSTORE)
